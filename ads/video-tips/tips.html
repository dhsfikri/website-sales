<!doctype html><html lang="ms"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#0b3b2c;--y:#ffd21f;--k:1}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000}
#s{width:1080px;height:1920px;position:relative;overflow:hidden;background:#07291f;color:#fff;font-family:Poppins,sans-serif}
#s.f45{height:1350px;--k:.74}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 45%}
#prog{position:absolute;top:0;left:0;right:0;height:8px;background:var(--y);transform-origin:left center;z-index:30}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,26,19,.55) 0%,rgba(4,26,19,.05) 28%,rgba(4,26,19,.35) 50%,rgba(4,26,19,.92) 74%,#04201a 100%)}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 260px rgba(0,0,0,.65)}
.dark{position:absolute;inset:0;background:#04201a;opacity:0}
.logo{position:absolute;top:calc(70px*var(--k));left:64px;height:calc(54px*var(--k));z-index:9}
.pill{position:absolute;top:calc(72px*var(--k));right:64px;z-index:9;background:var(--y);color:#1d1400;font-weight:800;font-size:calc(26px*var(--k));letter-spacing:.06em;padding:calc(12px*var(--k)) calc(24px*var(--k));border-radius:999px}
.hook{position:absolute;left:64px;right:64px;bottom:calc(330px*var(--k));z-index:8}
.hook div{font-weight:900;font-size:calc(104px*var(--k));line-height:1.02;letter-spacing:-.025em;text-shadow:0 6px 30px rgba(0,0,0,.45)}
.hook .y{color:var(--y)}
.hook div.sm{font-size:calc(64px*var(--k));font-weight:800;margin-top:calc(26px*var(--k));line-height:1.12}
/* chat */
.chat{position:absolute;left:60px;right:60px;top:calc(250px*var(--k));z-index:8;border-radius:44px;overflow:hidden;background:#efeae2;box-shadow:0 40px 90px rgba(0,0,0,.55);font-family:Inter,sans-serif;color:#111}
.ch{background:#f6f6f6;display:flex;align-items:center;gap:20px;padding:calc(26px*var(--k)) 30px;border-bottom:1px solid #ddd}
.av{width:calc(76px*var(--k));height:calc(76px*var(--k));border-radius:50%;background:#c9d6cf;display:grid;place-items:center;font-weight:700;font-size:calc(34px*var(--k));color:#2d4a3e;flex:none}
.ch b{display:block;font-size:calc(34px*var(--k));font-weight:700}
.ch span{font-size:calc(24px*var(--k));color:#667}
.cb{padding:calc(34px*var(--k)) 30px calc(40px*var(--k));display:flex;flex-direction:column;gap:calc(20px*var(--k));min-height:calc(720px*var(--k));justify-content:flex-end}
.day{align-self:center;background:#fff;color:#556;font-size:calc(22px*var(--k));padding:8px 18px;border-radius:12px;font-weight:600}
.bb{max-width:82%;padding:calc(20px*var(--k)) 26px calc(16px*var(--k));border-radius:24px;font-size:calc(40px*var(--k));line-height:1.36;box-shadow:0 2px 2px rgba(0,0,0,.08);position:relative;transform-origin:left bottom}
.bb.in{align-self:flex-start;background:#fff;border-top-left-radius:6px}
.bb.out{align-self:flex-end;background:#d9fdd3;border-top-right-radius:6px;transform-origin:right bottom}
.bb.old{opacity:.55}
.bb i{display:block;text-align:right;font-style:normal;font-size:calc(21px*var(--k));color:#667;margin-top:6px}
.bb i svg{width:30px;height:18px;vertical-align:-3px;margin-left:6px}
.typing{align-self:flex-start;background:#fff;border-radius:24px;padding:calc(24px*var(--k)) 28px;display:flex;gap:10px}
.typing span{width:16px;height:16px;border-radius:50%;background:#9aa5a0}
.seen{align-self:flex-end;font-size:calc(22px*var(--k));color:#8a6d00;font-weight:700;background:#fff6cc;padding:8px 16px;border-radius:10px}
/* number cards */
.nums{position:absolute;left:60px;right:60px;top:calc(300px*var(--k));z-index:8;display:flex;flex-direction:column;gap:calc(36px*var(--k))}
.nc{display:flex;align-items:center;gap:34px;background:rgba(255,255,255,.96);color:#0b3b2c;border-radius:34px;padding:calc(52px*var(--k)) 44px;box-shadow:0 30px 70px rgba(0,0,0,.45)}
.nc .n{width:calc(140px*var(--k));height:calc(140px*var(--k));border-radius:28px;background:var(--g);color:var(--y);display:grid;place-items:center;font-weight:900;font-size:calc(70px*var(--k));flex:none}
.nc b{font-weight:800;font-size:calc(56px*var(--k));line-height:1.15;display:block}
.nc span{font-size:calc(34px*var(--k));color:#3f6355;font-weight:600}
/* tip */
.tip{position:absolute;left:64px;right:64px;bottom:calc(150px*var(--k));z-index:9;background:var(--y);color:#1d1400;border-radius:34px;padding:calc(40px*var(--k)) 44px;box-shadow:0 30px 70px rgba(0,0,0,.5)}
.tip small{display:inline-block;background:#1d1400;color:var(--y);font-weight:800;font-size:calc(26px*var(--k));letter-spacing:.08em;padding:8px 18px;border-radius:999px;margin-bottom:calc(18px*var(--k))}
.tip p{font-weight:800;font-size:calc(50px*var(--k));line-height:1.18;letter-spacing:-.01em}
/* end */
.end{position:absolute;inset:0;z-index:20;background:radial-gradient(120% 80% at 50% 30%,#14523d 0%,#0b3b2c 45%,#04201a 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 70px}
.end img.cv{width:calc(400px*var(--k));border-radius:10px;box-shadow:30px 40px 80px rgba(0,0,0,.6);transform:perspective(1400px) rotateY(-16deg) rotateX(4deg)}
.end h2{font-weight:900;font-size:calc(84px*var(--k));line-height:1.04;letter-spacing:-.02em;margin-top:calc(70px*var(--k))}
.end h2 em{font-style:normal;color:var(--y)}
.end p{font-size:calc(38px*var(--k));font-weight:600;color:#d8ebe2;margin-top:calc(22px*var(--k))}
.price{margin-top:calc(34px*var(--k));display:flex;gap:22px;align-items:baseline;justify-content:center}
.price b{font-weight:900;font-size:calc(86px*var(--k));color:var(--y)}
.price s{font-size:calc(42px*var(--k));color:#9fbcb0;font-weight:600}
.cta{margin-top:calc(40px*var(--k));background:var(--y);color:#1d1400;font-weight:800;font-size:calc(44px*var(--k));padding:calc(26px*var(--k)) 54px;border-radius:999px;display:flex;align-items:center;gap:18px}
.cta svg{width:calc(44px*var(--k));height:calc(44px*var(--k))}
.fine{position:absolute;bottom:calc(60px*var(--k));left:0;right:0;font-size:calc(22px*var(--k));color:#9fbcb0;text-align:center}
</style></head><body>
<div id="s">
  <div id="prog"></div>
  <img id="bg">
  <div class="shade"></div><div class="vig"></div><div class="dark" id="dark"></div>
  <img class="logo" src="../../assets/logo-sirdharma.png">
  <div class="pill" id="pill"></div>
  <div class="hook" id="hook"></div>
  <div id="mid"></div>
  <div class="tip" id="tip"><small>TIPS</small><p id="tipt"></p></div>
  <div class="end" id="end">
    <img class="cv" src="../../assets/covers/ebook-2026.jpg">
    <h2 id="endh"></h2>
    <p>dalam Ebook 2026: Wassap Masih Relevan?</p>
    <div class="price"><b>RM37</b><s>RM67</s></div>
    <div class="cta">Tekan Learn More <svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="#1d1400" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="fine">Bahan latihan, bukan jaminan pendapatan.</div>
  </div>
</div>
<script>
const TICK='<svg viewBox="0 0 30 18"><path d="M1 9l5 5L16 3M11 14l3 0M12 13l1 1L24 3" fill="none" stroke="#53bdeb" stroke-width="2.4" stroke-linecap="round"/></svg>';
const V={
 1:{img:'konsultasi.jpg',pos:'44% 50%',pill:'TIPS PERCUMA #1',
    hook:['Prospek tanya','<span class=y>"Berapa?"</span>'],hook2:'Jangan terus bagi harga.',
    chat:{name:'Prospek',sub:'online',msgs:[
      {t:4.7,c:'in',x:'Salam, berapa harga?',h:'9:41'},
      {t:5.5,typing:[5.5,6.5],c:'out',x:'Boleh saya tanya dulu, nak guna untuk siapa? Supaya saya cadang yang paling sesuai, tak membazir.',h:'9:42',tk:1,at:6.5},
      {t:8.3,typing:[7.5,8.3],c:'in',x:'Untuk team saya, 5 orang staf.',h:'9:44'}]},
    tip:'Jawab harga dengan soalan. Prospek rasa difahami, bukan dijual.',
    end:'<em>50+ skrip</em> macam ni'},
 2:{img:'studio-tunjuk.jpg',pos:'50% 30%',pill:'TIPS PERCUMA #2',
    hook:['Bluetick','<span class=y>3 hari?</span>'],hook2:'Jangan hantar "Hi, macam mana?"',
    chat:{name:'Prospek',sub:'terakhir dilihat 3 hari lalu',msgs:[
      {t:4.6,day:'ISNIN'},
      {t:4.7,c:'out old',x:'Ni harga pakej yang encik minta ya.',h:'Isn 3:10',tk:1},
      {t:5.2,seen:'Dibaca · tiada balasan'},
      {t:5.9,day:'HARI INI'},
      {t:6.0,c:'out',x:'Saya faham mungkin sibuk. Saya simpan slot harga ni sampai Jumaat, lepas tu saya bagi pada yang lain. Nak saya teruskan untuk encik?',h:'10:05',tk:1},
      {t:8.4,typing:[7.5,8.4],c:'in',x:'Ya, teruskan. Saya transfer petang ni.',h:'10:12'}]},
    tip:'Follow up dengan sebab dan tarikh. Prospek senang jawab ya atau tidak.',
    end:'<em>Jadual follow up</em> penuh'},
 3:{img:'coaching-hq.jpg',pos:'50% 50%',pill:'TIPS PERCUMA #3',
    hook:['Owner,','closing team','<span class=y>naik turun?</span>'],hook2:'Semak 3 nombor ni setiap petang.',
    nums:[{t:4.6,n:'1',b:'Leads masuk hari ni',s:'Contoh: 40 leads'},
          {t:5.9,n:'2',b:'Dibalas bawah 5 minit',s:'Contoh: 22 daripada 40'},
          {t:7.2,n:'3',b:'Jadi bayar',s:'Contoh: 4 closing'}],
    tip:'Nombor yang jatuh tunjuk di mana team perlu dibantu.',
    end:'<em>Formula 1-4-6-10</em>'},
 4:{img:'pentas-influence.jpg',pos:'50% 40%',pill:'TIPS PERCUMA #4',
    hook:['Lepas bagi harga,','<span class=y>terus diam?</span>'],hook2:'Jangan jadi penunggu setia.',
    chat:{name:'Prospek',sub:'online',msgs:[
      {t:4.7,c:'out',x:'Harga pakej ni RM470 (asal RM600), jimat RM130.',h:'2:10',tk:1},
      {t:5.6,typing:[5.0,5.6],c:'out',x:'Nak saya hantar link bayar terus, atau nak saya lock slot ni untuk Jumaat?',h:'2:10',tk:1,at:5.6},
      {t:8.2,typing:[7.3,8.2],c:'in',x:'Hantar link terus la.',h:'2:13'}]},
    tip:'Bagi dua pilihan yang dua-dua menuju bayar. Jangan tanya "berminat tak?"',
    end:'<em>Teknik closing</em> lengkap'},
 5:{img:'podcast-sir.jpg',pos:'50% 30%',pill:'TIPS PERCUMA #5',
    hook:['Follow up tu','<span class=y>memaksa ke?</span>'],hook2:'Bergantung cara anda tegur.',
    chat:{name:'Prospek',sub:'terakhir dilihat semalam',msgs:[
      {t:4.6,day:'CARA SALAH'},
      {t:4.7,c:'out old',x:'Hi, macam mana? Bila nak bayar?',h:'9:00',tk:1},
      {t:5.9,day:'CARA BETUL'},
      {t:6.0,c:'out',x:'Hai kak, saya terjumpa tips ni pagi tadi, terus teringat kat akak. Mungkin membantu untuk team akak.',h:'9:05',tk:1},
      {t:8.4,typing:[7.5,8.4],c:'in',x:'Eh terima kasih, saya baru nak tanya pasal pakej tu..',h:'9:20'}]},
    tip:'Follow up dengan nilai, bukan dengan soalan "bila nak bayar?".',
    end:'<em>Ayat follow up</em> siap guna'},
 6:{img:'hero-whiteboard.jpg',pos:'27% 30%',pill:'TIPS PERCUMA #6',
    hook:['Prospek','<span class=y>tak reply?</span>'],hook2:'Bukan maksudnya dia tolak.',
    nums:[{t:4.6,n:'1',b:'Dia tengah sibuk',s:'Dah baca, cuma belum sempat balas'},
          {t:5.9,n:'2',b:'Dia nak fikir dulu',s:'Belum cukup yakin untuk bayar'},
          {t:7.2,n:'3',b:'Dia terlupa',s:'Chat tenggelam bawah chat lain'}],
    tip:'Bluetick bukan reject. Tegur semula dengan cara yang tak nampak terdesak.',
    end:'<em>Ayat bluetick</em> siap guna'},
 7:{img:'team-farmasi.jpg',pos:'50% 50%',pill:'TIPS PERCUMA #7',
    hook:['Bila patut','<span class=y>follow up?</span>'],hook2:'Lambat sehari, prospek dah sejuk.',
    nums:[{t:4.6,n:'1',b:'Dalam 24 jam',s:'Masa minat prospek paling tinggi'},
          {t:5.9,n:'2',b:'Bawa nilai baru',s:'Tips, testimoni atau info, bukan "bila nak bayar?"'},
          {t:7.2,n:'3',b:'Jarakkan, jangan berhenti',s:'Jangan berhenti selepas sekali tegur'}],
    tip:'24 jam pertama paling panas. Lepas tu jarakkan, setiap kali bawa nilai baru.',
    end:'<em>Teknik follow up</em> & ayat bluetick'}
};
const q=new URLSearchParams(location.search);const cfg=V[q.get('v')||1];
const S=document.getElementById('s');if(q.get('f')==='45')S.classList.add('f45');
document.getElementById('bg').src='../../assets/galeri/'+cfg.img;document.getElementById('bg').style.objectPosition=cfg.pos;
document.getElementById('pill').textContent=cfg.pill;
const hook=document.getElementById('hook');
hook.innerHTML=cfg.hook.map(h=>'<div>'+h+'</div>').join('')+'<div class=sm>'+cfg.hook2+'</div>';
document.getElementById('tipt').textContent=cfg.tip;document.getElementById('endh').innerHTML=cfg.end;
const mid=document.getElementById('mid');const items=[];
if(cfg.chat){
  mid.innerHTML='<div class=chat id=chat><div class=ch><div class=av>P</div><div><b>'+cfg.chat.name+'</b><span>'+cfg.chat.sub+'</span></div></div><div class=cb id=cb></div></div>';
  const cb=document.getElementById('cb');
  cfg.chat.msgs.forEach(m=>{
    if(m.typing){const d=document.createElement('div');d.className='typing';d.innerHTML='<span></span><span></span><span></span>';
      if(m.c==='out')d.style.alignSelf='flex-end',d.style.background='#d9fdd3';cb.appendChild(d);items.push({el:d,typ:m.typing});}
    const e=document.createElement('div');
    if(m.day){e.className='day';e.textContent=m.day}
    else if(m.seen){e.className='seen';e.textContent=m.seen}
    else{e.className='bb '+m.c;e.innerHTML=m.x+'<i>'+m.h+(m.tk?TICK:'')+'</i>'}
    cb.appendChild(e);items.push({el:e,t:m.t,bub:!m.day&&!m.seen});
  });
}else{
  mid.innerHTML='<div class=nums id=nums>'+cfg.nums.map(n=>'<div class=nc><div class=n>'+n.n+'</div><div><b>'+n.b+'</b><span>'+n.s+'</span></div></div>').join('')+'</div>';
  [...document.querySelectorAll('.nc')].forEach((e,i)=>items.push({el:e,t:cfg.nums[i].t,card:1}));
}
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const pr=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
window.DUR=12;
const shake=(t,t0,amp)=>{const d=t-t0;if(d<0||d>0.35)return 0;return amp*Math.exp(-d*14)*Math.sin(d*70);};
window.seek=function(t){
  const BT=60/128, ph=(t%BT)/BT, beat=Math.exp(-ph*7);
  // progress bar
  document.getElementById('prog').style.transform='scaleX('+cl(t/12)+')';
  // background: punch-in then fast push
  const punch=1+0.22*(1-eo(pr(t,0,0.4)));
  const sc=punch*1.05*Math.pow(1.3/1.05,cl(t/9.6));
  const bg=document.getElementById('bg');
  const sx=shake(t,0.35,10)+shake(t,0.55,8)+shake(t,0.75,6);
  bg.style.transform='translate('+sx+'px,'+(sx*0.5)+'px) scale('+(sc*(1+0.018*beat))+')';
  const bl=eo(pr(t,2.3,2.7));
  bg.style.filter='blur('+(5*bl)+'px) brightness('+(1-0.4*bl)+')';
  document.getElementById('dark').style.opacity=0.35*bl;
  // hook lines: slam in
  const hl=[...hook.children];
  hl.forEach((e,i)=>{const t0=0.2+i*0.2;const a=pr(t,t0,t0+0.22);const out=eo(pr(t,2.3,2.55));
    const s=1+0.45*(1-back(a));
    e.style.opacity=cl(a*3)*(1-out);
    e.style.transform='translateY('+(-out*160)+'px) scale('+s+') rotate('+((1-eo(a))*-4)+'deg)';
    e.style.transformOrigin='left center';});
  // mid (time remapped: 1.6x faster)
  const tm=t<2.6?0:4.0+(t-2.6)*1.6;
  const box=mid.firstElementChild;const a=pr(t,2.4,2.7);const o=eo(pr(t,9.3,9.6));
  box.style.opacity=a;box.style.transform='translateY('+((1-eo(a))*420-o*60)+'px) scale('+((0.9+0.1*back(a))*(1+0.012*beat*(t>2.7&&t<9.4?1:0)))+')';
  items.forEach((it,idx)=>{
    if(it.typ){const v=tm>=it.typ[0]&&tm<it.typ[1];it.el.style.display=v?'flex':'none';
      [...it.el.children].forEach((d,j)=>{d.style.transform='translateY('+(-8*Math.max(0,Math.sin((t*11-j*0.9))))+'px)'});return;}
    const k=pr(tm,it.t,it.t+0.3);
    it.el.style.display=tm>=it.t-0.001?'':'none';
    if(it.card){it.el.style.display='';const dir=idx%2?1:-1;it.el.style.opacity=cl(k*2);it.el.style.transform='translateX('+((1-back(k))*260*dir)+'px) scale('+(0.92+0.08*back(k))+')';}
    else if(it.bub){it.el.style.transform='scale('+(0.5+0.5*back(k))+')';it.el.style.opacity=cl(k*3);}
    else{it.el.style.opacity=k}
  });
  // tip: slam
  const tp=document.getElementById('tip');const ta=pr(t,7.0,7.3);
  tp.style.opacity=cl(ta*3);tp.style.transform='translateY('+((1-eo(ta))*120)+'px) scale('+(1+0.25*(1-back(ta)))+') rotate('+((1-eo(ta))*2)+'deg)';
  // end card: whip
  const e=document.getElementById('end');const ea=eo(pr(t,9.5,9.8));
  e.style.transform='translateY('+((1-ea)*100)+'%)';
  const cv=e.querySelector('.cv');const ca=pr(t,9.7,10.1);cv.style.transform='perspective(1400px) rotateY('+(-16+6*Math.sin(t*1.4))+'deg) rotateX(4deg) translateY('+((1-eo(ca))*80)+'px) scale('+(0.8+0.2*back(ca))+')';
  const pr2=e.querySelector('.price');const pa2=pr(t,10.0,10.25);pr2.style.opacity=cl(pa2*3);pr2.style.transform='scale('+(1+0.35*(1-back(pa2)))+')';
  const cta=e.querySelector('.cta');const pa=pr(t,10.3,10.6);cta.style.transform='scale('+(0.7+0.3*back(pa)+0.04*Math.sin(t*10)*(t>10.6?1:0))+')';cta.style.opacity=pa;
};
window.ready=Promise.all([document.fonts.ready,...[...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=r;i.onerror=r}))]);
seek(0);
</script></body></html>
